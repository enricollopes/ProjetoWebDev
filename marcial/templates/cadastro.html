
{%extends 'base.html'%}

{%block content%}

<div class="plano">



</div>

<link rel="stylesheet" href="../static/css/cadastro.css">

<div class="formulario">
    <h3> Antes de se matricular, realize seu cadastro</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="error">
                {{ messages[0] }}

            </div>
        {% endif %}
    {% endwith %}

    <form action="{{url_for('salvar_cadastro')}}" method="POST">
        <p>CPF</p>
        <input type="text" name="cpf" placeholder="Digite seu documento">

        <p> Nome Completo</p>
        <input type="text" id="nome" name="nome_usuario" placeholder="Digite seu nome">

        <p> E-mail</p>
        <input type="email" name="email" placeholder="Digite seu email">

        <p> Sexo</p>
        <select name="sexo">
            <option value="masculino"> Masculino</option>
            <option value="feminino"> Feminino</option>

        </select>
        <p> Modalidade Escolhida:</p>
        <select name="modalidade" id="">

            <option value="judo"> Judô</option>
            <option value="jitsu"> Jiu-Jitsu</option>
            <option value="muay"> Muay Thai</option>
            <option value="boxe"> Boxe</option>
        </select>

        <input type="hidden" name="plano_final" value="{{ plano_id }}">

        <button type="submit" class="enviar">  Finalizar Cadastro</button>
        
    </form>

</div>
{%endblock%}
